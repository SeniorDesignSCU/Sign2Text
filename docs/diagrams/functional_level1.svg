</defs><text x="980" y="40" font-family="Helvetica, Arial, sans-serif" font-size="24" font-weight="bold" fill="#1f2a44" text-anchor="middle">Level 1 Functional Block Diagram — Signs to Speech</text><rect x="280" y="130" width="1420" height="700" rx="10" fill="#fbfcfe" stroke="#1f2a44" stroke-width="2.2"/><text x="300" y="158" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="bold" fill="#1f2a44" text-anchor="start">Signs to Speech device — Raspberry Pi 5 (all recognition on device, no cloud)</text><rect x="320" y="200" width="200" height="120" rx="6" fill="#fff" stroke="#1f2a44" stroke-width="1.6"/><text x="420.0" y="246.0" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="bold" fill="#1f2a44" text-anchor="middle">Image Capture</text><text x="420.0" y="265.0" font-family="Helvetica, Arial, sans-serif" font-size="13.5" font-weight="normal" fill="#1f2a44" text-anchor="middle">Camera Module 3 Wide</text><text x="420.0" y="284.0" font-family="Helvetica, Arial, sans-serif" font-size="13.5" font-weight="normal" fill="#1f2a44" text-anchor="middle">120° view, autofocus</text><rect x="645" y="200" width="200" height="120" rx="6" fill="#eef3ff" stroke="#2f5bd3" stroke-width="1.6"/><text x="745.0" y="246.0" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="bold" fill="#1f2a44" text-anchor="middle">Landmark Extraction</text><text x="745.0" y="265.0" font-family="Helvetica, Arial, sans-serif" font-size="13.5" font-weight="normal" fill="#1f2a44" text-anchor="middle">MediaPipe hands + pose</text><text x="745.0" y="284.0" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" fill="#2f5bd3" text-anchor="middle">≥ 10 fps (15.0 measured)</text><rect x="970" y="200" width="200" height="120" rx="6" fill="#eef3ff" stroke="#2f5bd3" stroke-width="1.6"/><text x="1070.0" y="236.5" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="bold" fill="#1f2a44" text-anchor="middle">Feature Builder</text><text x="1070.0" y="255.5" font-family="Helvetica, Arial, sans-serif" font-size="13.5" font-weight="normal" fill="#1f2a44" text-anchor="middle">shoulder-normalized</text><text x="1070.0" y="274.5" font-family="Helvetica, Arial, sans-serif" font-size="13.5" font-weight="normal" fill="#1f2a44" text-anchor="middle">points + velocity</text><text x="1070.0" y="293.5" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" fill="#2f5bd3" text-anchor="middle">40-frame window ≈ 2 s</text><rect x="1295" y="200" width="200" height="120" rx="6" fill="#eef3ff" stroke="#2f5bd3" stroke-width="1.6"/><text x="1395.0" y="246.0" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="bold" fill="#1f2a44" text-anchor="middle">Sign Classifier</text><text x="1395.0" y="265.0" font-family="Helvetica, Arial, sans-serif" font-size="13.5" font-weight="normal" fill="#1f2a44" text-anchor="middle">1D-CNN + GRU on LiteRT</text><text x="1395.0" y="284.0" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" fill="#2f5bd3" text-anchor="middle">≥ 25 signs · ≥ 90 % acc.</text><path d="M 520 260.0 L 643 260.0" fill="none" stroke="#1f2a44" stroke-width="1.8" marker-end="url(#arrow)"/><text x="582.5" y="230.0" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#a6192e" text-anchor="middle">RGB frames</text><text x="582.5" y="246.0" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#a6192e" text-anchor="middle">640×480 @ ~15 fps</text><path d="M 845 260.0 L 968 260.0" fill="none" stroke="#1f2a44" stroke-width="1.8" marker-end="url(#arrow)"/><text x="907.5" y="230.0" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#a6192e" text-anchor="middle">150 values/frame</text><text x="907.5" y="246.0" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#a6192e" text-anchor="middle">(hands + pose)</text><path d="