rif" font-size="16" font-weight="bold" fill="#1f2a44" text-anchor="middle">Signer</text><text x="105.0" y="265.0" font-family="Helvetica, Arial, sans-serif" font-size="13.5" font-weight="normal" fill="#1f2a44" text-anchor="middle">ASL user's hands,</text><text x="105.0" y="284.0" font-family="Helvetica, Arial, sans-serif" font-size="13.5" font-weight="normal" fill="#1f2a44" text-anchor="middle">face, upper body</text><path d="M 190 260.0 L 318 260.0" fill="none" stroke="#1f2a44" stroke-width="1.8" marker-end="url(#arrow)"/><text x="235" y="230.0" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#a6192e" text-anchor="middle">ASL signs</text><text x="235" y="246.0" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#a6192e" text-anchor="middle">(light)</text><rect x="1295" y="58" width="200" height="58" rx="6" fill="#fff" stroke="#1f2a44" stroke-width="1.6" stroke-dasharray="7 5"/><text x="1395.0" y="82.5" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="bold" fill="#5b6478" text-anchor="middle">Model Training (offline)</text><text x="1395.0" y="101.5" font-family="Helvetica, Arial, sans-serif" font-size="13.5" font-weight="normal" fill="#5b6478" text-anchor="middle">team laptop · TensorFlow</text><path d="M 1455 116 L 1455 198" fill="none" stroke="#5b6478" stroke-width="1.8" stroke-dasharray="7 5" marker-end="url(#arrowG)"/><text x="1465" y="160" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#5b6478" text-anchor="start">model file</text><text x="1465" y="176" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#5b6478" text-anchor="start">(.tflite)</text><rect x="320" y="640" width="200" height="100" rx="6" fill="#fff" stroke="#1f2a44" stroke-width="1.6"/><text x="420.0" y="676.0" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="bold" fill="#1f2a44" text-anchor="middle">Power Supply</